services:
  mysql:
    image: mysql:8.0
    container_name: learnmate_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
      MYSQL_DATABASE: ${DB_NAME:-learnmate}
      MYSQL_USER: ${DB_USER:-learnmate_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-learnmate_pass}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    networks:
      - learnmate-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: learnmate_ai
    restart: always
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - LLM_MODEL=${LLM_MODEL:-gemini-3.5-flash-lite}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-LM_Internal_Key_987654}
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    networks:
      - learnmate-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: learnmate_backend
    restart: always
    environment:
      DATABASE_URL: mysql+pymysql://${DB_USER:-learnmate_user}:${DB_PASSWORD:-learnmate_pass}@mysql:3306/${DB_NAME:-learnmate}?charset=utf8mb4
      DB_USER: ${DB_USER:-learnmate_user}
      DB_PASSWORD: ${DB_PASSWORD:-learnmate_pass}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:8000}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-LM_Internal_Key_987654}
      JWT_SECRET: ${JWT_SECRET:-YourSuperSecretKeyMin32Chars2026!}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - learnmate-net
    depends_on:
      mysql:
        condition: service_healthy
      ai-service:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: learnmate_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    networks:
      - learnmate-net
    depends_on:
      - backend

networks:
  learnmate-net:
    driver: bridge

volumes:
  mysql_data:
    driver: local

