services:
  # ============================================================================
  # 1. Cơ sở dữ liệu MySQL 8.0 (SDD Bảng 22 - Cụm CSDL 21 thực thể)
  # ============================================================================
  mysql:
    image: mysql:8.0
    container_name: learnmate_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
      MYSQL_DATABASE: ${DB_NAME:-learnmate}
      MYSQL_USER: ${DB_USER:-learnmate_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-learnmate_pass}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    networks:
      - learnmate-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # 2. AI Microservice (FastAPI - Cổng 8000, SDD Bảng 22)
  # ============================================================================
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: learnmate_ai
    restart: always
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - LLM_MODEL=${LLM_MODEL:-gemini-3.5-flash-lite}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in .env}
    networks:
      - learnmate-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ai/health"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3

  # ============================================================================
  # 3. Backend Core Service (FastAPI - Cổng 8080, SDD Bảng 22)
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: learnmate_backend
    restart: always
    environment:
      DATABASE_URL: mysql+pymysql://${DB_USER:-learnmate_user}:${DB_PASSWORD:-learnmate_pass}@mysql:3306/${DB_NAME:-learnmate}?charset=utf8mb4
      DB_USER: ${DB_USER:-learnmate_user}
      DB_PASSWORD: ${DB_PASSWORD:-learnmate_pass}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:8000}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-LM_Internal_Key_987654}
      JWT_SECRET: ${JWT_SECRET:-YourSuperSecretKeyMin32Chars2026!}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:80,http://localhost:3000}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - learnmate-net
    depends_on:
      mysql:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3

  # ============================================================================
  # 4. Frontend SPA (React + Vite + Nginx - Cổng 80/5173, SDD Bảng 22)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api/v1}
    container_name: learnmate_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    networks:
      - learnmate-net
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 20s
      timeout: 3s
      start_period: 5s
      retries: 3

# ==============================================================================
# Isolated Bridge Network (SDD Bảng 22)
# ==============================================================================
networks:
  learnmate-net:
    name: learnmate-net
    driver: bridge

# ==============================================================================
# Persistent Named Volumes
# ==============================================================================
volumes:
  mysql_data:
    name: learnmate_mysql_data
    driver: local
